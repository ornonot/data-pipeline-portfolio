name: dbt CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt_job:
    runs-on: ubuntu-latest

    steps:
      # 1. チェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. GCP 認証
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. dbt-bigquery インストール
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      # 5. dbt 実行・テスト
      - name: Run dbt run and test
        run: |
          dbt run
          dbt test

      # 6. 成功時の Slack 通知
      - name: Slack Notification on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *dbt CI/CD Pipeline Succeeded!*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # 7. 失敗時の Slack 通知
      - name: Slack Notification on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *dbt CI/CD Pipeline Failed!*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK