name: dbt CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt_job:
    runs-on: ubuntu-latest

    steps:
      # 1. チェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. dbt-bigquery インストール
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      # 4. ディレクトリ作成 ＆ GCP サービスアカウントキー作成 ＆ profiles.yml の動的生成
      - name: Setup Credentials and profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo '${{ secrets.GCP_SA_KEY }}' > ~/.dbt/gcp-key.json
          cat << 'EOF' > ~/.dbt/profiles.yml
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: de-portfolio-2026
                dataset: dbt_workspace
                location: asia-northeast1
                priority: interactive
                threads: 1
                keyfile: /home/runner/.dbt/gcp-key.json
          EOF

      # 5. dbt 実行 ＆ テスト
      - name: Run dbt run and test
        run: |
          dbt run --full-refresh
          dbt test

      # 6. 成功時の Slack 通知
      - name: Slack Notification on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *dbt CI/CD Pipeline Succeeded!*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # 7. 失敗時の Slack 通知
      - name: Slack Notification on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *dbt CI/CD Pipeline Failed!*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK